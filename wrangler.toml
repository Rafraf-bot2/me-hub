# Config Cloudflare Pages du hub (me-hub). Les Pages Functions vivent dans /functions.
# Le binding D1 ci-dessous est consommé par functions/api/sport.js + functions/ingest/*.
# Secrets (jamais ici) : INGEST_TOKEN → `wrangler pages secret put INGEST_TOKEN`.

name = "me-hub"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

# Base D1 privée du monde /sport.
# database_id : à remplir avec la sortie de `wrangler d1 create me-sport`.
[[d1_databases]]
binding = "DB"
database_name = "me-sport"
database_id = "REMPLIR_APRES_d1_create"
